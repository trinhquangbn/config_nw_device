<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>{% block title %}NetAuto{% endblock %}</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background:#f7f8fa; color:#222; }
    nav { background:#1f2933; padding:14px 24px; }
    nav a { color:#fff; margin-right:18px; text-decoration:none; font-weight:600; }
    .container { padding: 24px; max-width: 1100px; margin: 0 auto; }
    table { border-collapse: collapse; width:100%; background:#fff; }
    th, td { border:1px solid #e0e0e0; padding:8px 10px; font-size:14px; text-align:left; }
    th { background:#eef1f4; }
    .card { background:#fff; border-radius:8px; padding:16px 20px; box-shadow:0 1px 3px rgba(0,0,0,.08); margin-bottom:16px; }
    .stat { display:inline-block; margin-right:32px; }
    .stat b { font-size:22px; display:block; }
    button, input[type=submit] { background:#2563eb; color:#fff; border:none; padding:8px 16px; border-radius:6px; cursor:pointer; }
    .flash { background:#fff3cd; padding:10px 14px; border-radius:6px; margin-bottom:14px; }
    .ok { color:#0a7d28; font-weight:bold; }
    .fail { color:#c1121f; font-weight:bold; }
    textarea { width:100%; height:180px; font-family:monospace; }
    .hint { background:#f3f4f6; padding:8px 12px; border-radius:6px; font-size:13px; white-space:pre-wrap; }
    .hint:empty { display:none; }
  </style>
</head>
<body>
<nav>
  <a href="{{ url_for('dashboard') }}">Dashboard</a>
  <a href="{{ url_for('devices_view') }}">Devices</a>
  <a href="{{ url_for('push') }}">Push Config</a>
  <a href="{{ url_for('reports') }}">Reports</a>
</nav>
<div class="container">
  {% with messages = get_flashed_messages() %}
    {% if messages %}{% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}{% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
